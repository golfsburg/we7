<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>PV Tracker — Pinggau</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ── TOKENS ─────────────────────────────────────────────── */
:root{
  --bg:#08090a; --bg2:#111314; --bg3:#1a1d20; --bg4:#21252a;
  --b1:rgba(255,255,255,.08); --b2:rgba(255,255,255,.16);
  --tx:#f5f5f2; --tx2:#a8acb5; --tx3:#6b7080;
  --ac:#f5c842; --ac2:#e8a020;
  --gr:#3fcf8e; --gr2:#1a7a52;
  --rd:#f25c5c; --bl:#5b9cf6; --pu:#a78bfa;
  --fd:'Syne',sans-serif; --fm:'DM Mono',monospace;
  --r:10px; --rl:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:15px}
body{background:var(--bg);color:var(--tx);font-family:var(--fm);min-height:100vh;line-height:1.65}

/* ── LAYOUT ─────────────────────────────────────────────── */
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.main{overflow-y:auto;min-height:100vh}
.page{display:none;padding:28px 32px;animation:fadeIn .18s ease}
.page.active{display:block}
@keyframes fadeIn{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ── SIDEBAR ────────────────────────────────────────────── */
.sidebar{background:var(--bg2);border-right:1px solid var(--b1);padding:20px 0;
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.logo{padding:0 20px 20px;border-bottom:1px solid var(--b1);margin-bottom:10px}
.logo-row{display:flex;align-items:center;gap:8px}
.logo-dot{width:8px;height:8px;background:var(--ac);border-radius:50%;box-shadow:0 0 6px var(--ac)}
.logo-name{font-family:var(--fd);font-size:16px;font-weight:700}
.logo-ver{font-size:9px;color:var(--tx3);margin-left:auto;letter-spacing:.5px}
.logo-sub{font-size:10px;color:var(--tx3);text-transform:uppercase;letter-spacing:.8px;margin-top:4px;padding-left:16px}
.nav{padding:0 10px}
.nav-btn{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:var(--r);
  font-family:var(--fm);font-size:13px;color:var(--tx2);cursor:pointer;
  border:none;background:transparent;width:100%;text-align:left;transition:all .15s}
.nav-btn:hover{background:var(--bg3);color:var(--tx)}
.nav-btn.active{background:rgba(245,200,66,.12);color:var(--ac);font-weight:500}
.nav-btn .ni{font-size:16px;width:20px;text-align:center;opacity:.9}
.nav-divider{height:1px;background:var(--b1);margin:8px 12px}
.nav-group{margin-bottom:4px}
.nav-group-label{font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--tx3);
  font-weight:600;padding:10px 16px 4px;display:block}
.sb-bottom{margin-top:auto;padding:14px 18px;border-top:1px solid var(--b1)}
.sb-kpi{margin-bottom:10px}
.sb-kpi-l{font-size:9px;text-transform:uppercase;letter-spacing:.8px;color:var(--tx3)}
.sb-kpi-v{font-size:20px;font-weight:500}
.sb-kpi-u{font-size:11px;color:var(--tx2);margin-left:2px}
#sync-wrap{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:10px;color:var(--tx3)}
#sync-dot{width:5px;height:5px;border-radius:50%;background:var(--tx3);flex-shrink:0;transition:all .3s}

/* ── COMMON COMPONENTS ──────────────────────────────────── */
.ph{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:22px;gap:12px;flex-wrap:wrap}
.ph-title{font-family:var(--fd);font-size:24px;font-weight:700;letter-spacing:-.5px}
.ph-sub{font-size:12px;color:var(--tx2);margin-top:3px}

/* Filter bar */
.fbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;
  background:var(--bg2);border:1px solid var(--b1);border-radius:var(--r);padding:9px 13px;margin-bottom:20px}
.fbar label{font-size:11px;color:var(--tx2);text-transform:uppercase;letter-spacing:.7px}
.fbar input,.fbar select{background:var(--bg3);border:1px solid var(--b2);color:var(--tx);
  border-radius:6px;padding:5px 10px;font-family:var(--fm);font-size:12px;outline:none}
.fbar input:focus,.fbar select:focus{border-color:var(--ac)}
.fsep{color:var(--b2);user-select:none}

/* Buttons */
.btn-p{background:var(--ac);color:#1a1200;border:none;padding:6px 16px;border-radius:6px;
  font-family:var(--fm);font-size:12px;font-weight:600;cursor:pointer;transition:.15s}
.btn-p:hover{background:var(--ac2)}
.btn-s{background:transparent;border:1px solid var(--b2);color:var(--tx2);padding:6px 13px;
  border-radius:6px;font-family:var(--fm);font-size:12px;cursor:pointer;transition:.15s}
.btn-s:hover{border-color:var(--tx);color:var(--tx)}
.btn-d{border-color:rgba(242,92,92,.4)!important;color:var(--rd)!important}
.btn-d:hover{border-color:var(--rd)!important;background:rgba(242,92,92,.08)!important}

/* Metrics grid */
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.mc{background:var(--bg2);border:1px solid var(--b1);border-radius:var(--rl);padding:16px;transition:border-color .2s}
.mc:hover{border-color:var(--b2)}
.mc.hi{border-color:rgba(245,200,66,.3)}
.mc.gr{border-color:rgba(63,207,142,.25)}
.mc.bl{border-color:rgba(91,156,246,.25)}
.mc.pu{border-color:rgba(167,139,250,.25)}
.mc-l{font-size:10px;color:var(--tx2);text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px}
.mc-v{font-size:27px;font-weight:500;line-height:1}
.mc-u{font-size:12px;color:var(--tx2);margin-left:3px}
.mc-d{font-size:11px;margin-top:6px;color:var(--tx2)}
.mc-d.pos{color:var(--gr)} .mc-d.neg{color:var(--rd)}

/* Chart cards */
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px}
.cgrid.g3{grid-template-columns:1fr 1fr 1fr}
.cc{background:var(--bg2);border:1px solid var(--b1);border-radius:var(--rl);padding:18px}
.cc.full{grid-column:1/-1}
.cc-title{font-family:var(--fd);font-size:14px;font-weight:600;margin-bottom:3px}
.cc-sub{font-size:11px;color:var(--tx3);margin-bottom:12px}
.cw{position:relative;width:100%}
.leg{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:8px}
.li{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--tx2)}
.ld{width:8px;height:8px;border-radius:2px;flex-shrink:0}

/* Tables */
.tcard{background:var(--bg2);border:1px solid var(--b1);border-radius:var(--rl);overflow:hidden;margin-bottom:20px}
.thead{display:flex;align-items:center;justify-content:space-between;padding:13px 17px;border-bottom:1px solid var(--b1)}
.thead-t{font-family:var(--fd);font-size:14px;font-weight:600}
table{width:100%;border-collapse:collapse}
th{padding:9px 13px;text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.8px;
  color:var(--tx2);font-weight:500;border-bottom:1px solid var(--b1);background:var(--bg3)}
td{padding:10px 13px;font-size:12px;border-bottom:1px solid var(--b1)}
tr:last-child td{border-bottom:none} tr:hover td{background:rgba(255,255,255,.02)}
.badge{font-size:10px;padding:2px 8px;border-radius:20px;font-weight:500}
.badge.good{background:rgba(63,207,142,.15);color:var(--gr)}
.badge.mid{background:rgba(245,200,66,.15);color:var(--ac)}
.badge.low{background:rgba(242,92,92,.15);color:var(--rd)}
.ebar{height:4px;width:55px;background:var(--bg3);border-radius:2px;overflow:hidden;display:inline-block;vertical-align:middle;margin-right:5px}
.efill{height:100%;border-radius:2px}

/* Form cards */
.fcard{background:var(--bg2);border:1px solid var(--b1);border-radius:var(--rl);padding:20px;margin-bottom:14px}
.fcard-t{font-family:var(--fd);font-size:15px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px;margin-bottom:13px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--tx2);font-weight:500}
.field input,.field select{background:var(--bg3);border:1px solid var(--b2);color:var(--tx);
  border-radius:8px;padding:8px 10px;font-family:var(--fm);font-size:13px;outline:none;transition:border-color .15s}
.field input:focus,.field select:focus{border-color:var(--ac)}
.field input::placeholder{color:var(--tx3)}
.brow{display:flex;gap:9px;flex-wrap:wrap}
.note{font-size:12px;color:var(--tx2);padding:11px 14px;background:var(--bg3);
  border-radius:8px;border-left:3px solid var(--ac);margin-top:12px;line-height:1.75}
.csv-area{width:100%;min-height:120px;background:var(--bg3);border:1px solid var(--b2);
  border-radius:8px;color:var(--tx);font-family:var(--fm);font-size:11px;padding:10px;
  outline:none;resize:vertical;margin-bottom:10px}
.csv-area:focus{border-color:var(--ac)}
.code-block{background:var(--bg);border:1px solid var(--b2);border-radius:8px;
  padding:11px 13px;font-family:var(--fm);font-size:11px;color:var(--bl);
  margin:8px 0;line-height:1.8;white-space:pre;overflow-x:auto}
.copy-btn{font-size:10px;padding:3px 8px;background:transparent;border:1px solid var(--b2);
  color:var(--tx2);border-radius:4px;cursor:pointer;flex-shrink:0}
.copy-btn:hover{border-color:var(--ac);color:var(--ac)}

/* Tabs */
.mtabs{display:flex;gap:3px;background:var(--bg3);border-radius:7px;padding:3px;width:fit-content;margin-bottom:18px}
.mtab{padding:6px 18px;border-radius:5px;font-size:12px;font-family:var(--fm);
  cursor:pointer;border:none;background:transparent;color:var(--tx2);transition:.15s}
.mtab.active{background:var(--bg2);color:var(--tx);border:1px solid var(--b2)}

/* Modal */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:500;
  align-items:center;justify-content:center}
.modal-box{background:var(--bg2);border:1px solid var(--b2);border-radius:var(--rl);
  padding:26px 30px;width:560px;max-width:95vw;max-height:90vh;overflow-y:auto}
.modal-hdr{font-family:var(--fd);font-size:17px;font-weight:700;margin-bottom:18px;
  display:flex;justify-content:space-between;align-items:center}
.modal-close{background:transparent;border:none;color:var(--tx2);font-size:20px;cursor:pointer}

/* Toast */
.toast{position:fixed;bottom:22px;right:22px;z-index:9998;background:var(--bg2);
  border:1px solid var(--gr2);color:var(--gr);border-radius:8px;padding:11px 18px;
  font-size:12px;font-family:var(--fm);opacity:0;transform:translateY(8px);
  transition:all .25s;pointer-events:none}
.toast.show{opacity:1;transform:translateY(0)}
.toast.err{border-color:rgba(242,92,92,.5);color:var(--rd)}

/* ── TIMELINE RANGE PICKER ───────────────────────────────── */
.tl-wrap{position:relative;margin:0 0 20px;user-select:none}
.tl-track{position:relative;height:36px;background:var(--bg3);border:1px solid var(--b2);
  border-radius:8px;cursor:crosshair;overflow:hidden}
.tl-fill{position:absolute;top:0;bottom:0;background:rgba(245,200,66,.18);
  border-left:2px solid var(--ac);border-right:2px solid var(--ac);pointer-events:none}
.tl-handle{position:absolute;top:50%;transform:translate(-50%,-50%);
  width:14px;height:26px;background:var(--ac);border-radius:4px;cursor:ew-resize;z-index:2;
  display:flex;align-items:center;justify-content:center}
.tl-handle::after{content:'⋮';color:#1a1200;font-size:14px;line-height:1}
.tl-labels{display:flex;justify-content:space-between;margin-top:3px;
  font-size:10px;color:var(--tx3);padding:0 2px}
.tl-ticks{position:absolute;top:0;bottom:0;left:0;right:0;pointer-events:none}
.tl-tick{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.06)}
.tl-tick-lbl{position:absolute;top:50%;transform:translateX(-50%) translateY(-50%);
  font-size:9px;color:var(--tx3);white-space:nowrap;pointer-events:none}
.tl-sel-lbl{position:absolute;top:2px;left:50%;transform:translateX(-50%);
  font-size:10px;color:var(--ac);font-weight:500;white-space:nowrap;pointer-events:none;
  background:rgba(8,9,10,.7);padding:0 4px;border-radius:3px}

/* ── GRANULARITY BAR ─────────────────────────────────────── */
.gran-bar{display:flex;align-items:center;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.gran-lbl{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--tx3);font-weight:500;margin-right:4px}
.gran-opt{display:flex;align-items:center;gap:5px;cursor:pointer;padding:5px 12px;
  border:1px solid var(--b2);border-radius:20px;font-size:12px;color:var(--tx2);
  background:var(--bg3);transition:all .15s;user-select:none}
.gran-opt:has(input:checked){background:rgba(245,200,66,.15);border-color:var(--ac);color:var(--ac);font-weight:500}
.gran-opt input{display:none}

/* Scrollbar */
::-webkit-scrollbar{width:5px} ::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--bg3);border-radius:3px}

@media(max-width:768px){
  .app{grid-template-columns:1fr}
  .sidebar{height:auto;position:static;flex-direction:row;flex-wrap:wrap;padding:10px}
  .sb-bottom{display:none}
  .cgrid,.cgrid.g3{grid-template-columns:1fr}
  .page{padding:14px}
}
</style>
</head>
<body>

<!-- MAIN APP -->
<div class="app" id="main-app">

  <!-- SIDEBAR -->
  <nav class="sidebar">
    <div class="logo">
      <div class="logo-row">
        <span class="logo-dot"></span>
        <span class="logo-name">PV Tracker</span>
        <span class="logo-ver">v4.7</span>
      </div>
      <div class="logo-sub">Pinggau · 800W · SW 35°</div>
    </div>
    <div class="nav">
      <!-- PV Bilanz -->
      <div class="nav-group">
        <span class="nav-group-label">PV Bilanz</span>
        <button class="nav-btn active" onclick="APP.nav('dashboard')"><span class="ni">◈</span>Dashboard</button>
        <button class="nav-btn" onclick="APP.nav('pv')"><span class="ni">☀</span>PV Ertrag</button>
        <button class="nav-btn" onclick="APP.nav('simulation')"><span class="ni">🔬</span>Simulation</button>
        <button class="nav-btn" onclick="APP.nav('consumption')"><span class="ni">⚡</span>Stromverbrauch</button>
      </div>
      <div class="nav-divider"></div>
      <!-- Verbrauchsbilanz -->
      <div class="nav-group">
        <span class="nav-group-label">Verbrauchsbilanz</span>
        <button class="nav-btn" onclick="APP.nav('consumption2')"><span class="ni">📊</span>Verbrauchsbilanz</button>
      </div>
      <div class="nav-divider"></div>
      <!-- Einstellungen -->
      <div class="nav-group">
        <button class="nav-btn" onclick="APP.nav('settings')"><span class="ni">⚙</span>Einstellungen</button>
      </div>
    </div>
    <div class="sb-bottom">
      <div class="sb-kpi">
        <div class="sb-kpi-l">PV Gesamt</div>
        <div class="sb-kpi-v" id="sb-pv">—<span class="sb-kpi-u">kWh</span></div>
      </div>
      <div class="sb-kpi">
        <div class="sb-kpi-l">Verbrauch</div>
        <div class="sb-kpi-v" id="sb-cv">—<span class="sb-kpi-u">kWh</span></div>
      </div>
      <div class="sb-kpi">
        <div class="sb-kpi-l">Autarkie</div>
        <div class="sb-kpi-v" id="sb-au">—<span class="sb-kpi-u">%</span></div>
      </div>
      <div id="sync-wrap">
        <span id="sync-dot"></span>
        <span id="sync-txt">—</span>
      </div>
    </div>
  </nav>

  <!-- PAGE CONTAINER -->
  <main class="main" id="page-container">
    <!-- Pages are injected here by each module -->
  </main>

</div>

<!-- MODAL (shared) -->
<div class="modal-bg" id="edit-modal-bg">
  <div class="modal-box">
    <div class="modal-hdr">
      <span id="em-title">Eintrag bearbeiten</span>
      <button class="modal-close" onclick="APP.closeModal()">✕</button>
    </div>
    <div class="fgrid" id="em-fields"></div>
    <input type="hidden" id="em-id">
    <input type="hidden" id="em-type">
    <div class="brow" style="margin-top:4px">
      <button class="btn-p" onclick="APP.saveModal()">Speichern</button>
      <button class="btn-s" onclick="APP.closeModal()">Abbrechen</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- CORE MODULE (shared state, supabase, utils) -->
<script src="core.js?v=1787805493"></script>
<!-- PAGE MODULES -->
<script src="page-dashboard.js?v=1787805493"></script>
<script src="page-pv.js?v=1787805493"></script>
<script src="page-consumption.js?v=1787805493"></script>
<script src="page-consumption2.js?v=1787805493"></script>
<script src="page-settings.js?v=1787805493"></script>
<!-- BOOT -->
<script>
  window.addEventListener('load', () => {
    APP.registerPages();  // injects all page HTML into DOM first
    APP.boot();           // loads storage, connects supabase
    APP.nav('dashboard'); // navigate AFTER pages exist in DOM
  });
</script>

</body>
</html>
