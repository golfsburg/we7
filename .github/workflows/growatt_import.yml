name: Growatt → Supabase Auto-Import

on:
  schedule:
    - cron: '30 23 * * *'
  workflow_dispatch:
    inputs:
      import_date:
        description: 'Datum importieren (YYYY-MM-DD), leer = heute'
        required: false
        default: ''

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Abhängigkeiten installieren und patchen
        run: |
          pip install --upgrade pip
          pip install "growattServer==2.2.0" requests
          SITE=$(python -c "import site; print(site.getsitepackages()[0])")
          FILE="$SITE/growattServer/open_api_v1/devices/abstract_device.py"
          sed -i 's/type ParameterValue = str | float | bool | list\[Any\] | dict\[str, Any\]/ParameterValue = str/g' "$FILE"
          echo "✓ Patched"

      - name: Growatt Tagesimport ausführen
        env:
          GROWATT_USER: ${{ secrets.GROWATT_USER }}
          GROWATT_PASS: ${{ secrets.GROWATT_PASS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          IMPORT_DATE:  ${{ github.event.inputs.import_date }}
        run: python growatt_import.py

      - name: Cache-Buster in index.html aktualisieren
        run: |
          TS=$(date +%s)
          sed -i "s/\.js?v=[0-9]*/\.js?v=$TS/g" index.html
          echo "✓ Cache-Buster: $TS"

      - name: Änderungen committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "Auto-Import $(date +%Y-%m-%d) [cache-bust]"
          git push
